<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Инвестиции</title>
  <style>
    :root { color-scheme: light; --bg:#f3f4f6; --card:#fff; --ink:#1c1c1c; --muted:#8b919a; --line:#e6e8ec; --yellow:#ffdd2d; --yellow-2:#f5c400; --down:#d0121a; }
    * { box-sizing: border-box; }
    nav { display: flex; gap: 8px; }
    [data-page] { display: grid; gap: 12px; }
    [data-page][hidden] { display: none; }
    nav a { text-decoration: none; color: inherit; background: var(--card); border-radius: 12px; padding: 8px 14px; font-weight: 700; }
    nav a.on { background: var(--yellow); }
    nav a:hover { background: var(--line); }
    nav a.on:hover { background: var(--yellow-2); }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 "Segoe UI", sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
    h1 { margin: 0; font-size: 26px; }
    .muted { color: var(--muted); }
    .kicker { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    header, form, .stats, .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; justify-content: space-between; }
    .card, input, button { background: var(--card); border: 0; border-radius: 12px; }
    input, button { height: 40px; padding: 0 12px; font: inherit; }
    input { min-width: 160px; }
    button { font-weight: 700; cursor: pointer; }
    button:hover { background: var(--line); }
    button.on, button.add { background: var(--yellow); }
    button.on:hover, button.add:hover { background: var(--yellow-2); }
    .stat.win { background: #e5f6ea; }
    .down { color: var(--down); }
    .split { display: grid; grid-template-columns: 190px 1fr; gap: 12px; }
    .panel, .sleeve { background: var(--card); border-radius: 16px; padding: 12px; }
    .sleeves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sleeve h2 { margin: 0; font-size: 14px; }
    .sleeve .value { font-size: 20px; font-weight: 700; }
    .top { display: flex; justify-content: space-between; align-items: baseline; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .chips button { height: 28px; background: var(--bg); font-size: 12px; }
    svg { width: 96px; height: 96px; }
    .donut { display: flex; align-items: center; gap: 8px; }
    .ranges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .ranges label { display: grid; gap: 2px; color: var(--muted); font-size: 11px; }
    .ranges input, .ranges select { width: 118px; height: 36px; background: var(--bg); }
    th button { height: auto; padding: 8px 0; background: transparent; color: var(--muted); font-weight: 500; }
    th button:hover { background: transparent; color: var(--ink); }
    th, td { text-align: left; padding: 8px; vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    tr + tr td { border-top: 1px solid var(--line); }
    .scroll { overflow-x: auto; }
    .token { flex: 1; }
    #status { margin: 0; font-size: 22px; }
    #toast.show { opacity: 1; }
    .control { display: grid; grid-template-columns: 1.4fr .8fr; gap: 12px; }
    .check { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .check input { width: auto; min-width: 0; height: auto; }
    #log div + div { margin-top: 6px; }
    @media (max-width: 800px) { .control { display: block; } .control .panel + .panel { margin-top: 8px; } }
  </style>
</head>
<body>
<main>
  <nav>
    <a href="/" data-nav="/">Портфель</a>
    <a href="/bonds" data-nav="/bonds">Облигации</a>
    <a href="/strategy" data-nav="/strategy">Стратегия</a>
  </nav>
  <section data-page="/">
  <header>
    <div>
      <div class="muted kicker">ИНВЕСТИЦИИ</div>
      <h1 id="title">Портфель</h1>
      <div class="muted" id="subtitle">Стратегия остановлена</div>
    </div>
    <div class="stats">
      <div class="card stat" id="forecastCard"><div class="muted">Прогноз стратегии</div><strong id="forecast">—</strong></div>
      <div class="card stat" id="keyCard"><div class="muted">Ключевая</div><strong>14%</strong></div>
      <div class="card stat" id="creditCard"><div class="muted">Кредиты, средняя</div><strong>30,1%</strong></div>
      <div class="card stat" id="gapCard"><div class="muted">Разрыв</div><strong id="gap">—</strong></div>
    </div>
  </header>
  <form id="form">
    <input class="token" id="token" type="password" placeholder="Токен Т-Инвестиций" autocomplete="off" />
    <button type="submit" id="refresh">Обновить с биржи</button>
  </form>
  <div class="muted" id="note"></div>
  <section class="control">
    <div class="panel">
      <div class="top">
        <div>
          <div class="muted">Статус</div>
          <h2 id="status">Остановлена</h2>
        </div>
        <button id="toggle" class="add" type="button">Запустить стратегию</button>
      </div>
      <label class="check"><input id="reinvest" type="checkbox" checked> Реинвестировать купоны и фандинг в лучшую корзину</label>
      <label class="check"><input id="auto" type="checkbox"> Разрешить заявки без отдельного подтверждения</label>
      <div class="muted" id="next"></div>
    </div>
    <div class="panel">
      <div class="muted">Журнал</div>
      <div id="log"></div>
    </div>
  </section>
  <section class="split">
    <div class="panel donut"><svg id="ring"></svg><div id="legend"></div></div>
    <div class="sleeves" id="sleeves"></div>
  </section>
  </section>
  <section class="panel" data-page="/bonds">
    <div class="filters">
      <div id="filters"></div>
      <input id="query" placeholder="Название или ISIN" />
      <span class="muted" id="count"></span>
    </div>
    <div class="ranges">
      <label>Доходность от<input id="ytmMin" inputmode="decimal" placeholder="%"></label>
      <label>Доходность до<input id="ytmMax" inputmode="decimal" placeholder="%"></label>
      <label>Купон от<input id="couponMin" inputmode="decimal" placeholder="%"></label>
      <label>Выплаты<select id="payFilter"><option value="">все</option><option value="месяц">каждый месяц</option><option value="квартал">раз в квартал</option><option value="полгода">раз в полгода</option><option value="год">раз в год</option></select></label>
      <label>Погашение до<input id="maturityMax" inputmode="numeric" placeholder="год"></label>
      <label>Дюрация до<input id="durationMax" inputmode="decimal" placeholder="лет"></label>
      <label>Цена от<input id="priceMin" inputmode="decimal" placeholder="%"></label>
      <label>Оборот от<input id="turnoverMin" inputmode="decimal" placeholder="млн ₽"></label>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th><button type="button" data-sort="name" data-label="Бумага">Бумага</button></th>
          <th><button type="button" data-sort="ytm" data-label="К погашению">К погашению</button></th>
          <th><button type="button" data-sort="coupon" data-label="Купон">Купон</button></th>
          <th><button type="button" data-sort="frequency" data-label="Выплаты">Выплаты</button></th>
          <th><button type="button" data-sort="maturity" data-label="Погашение">Погашение</button></th>
          <th><button type="button" data-sort="duration" data-label="Дюрация">Дюрация</button></th>
          <th><button type="button" data-sort="price" data-label="Цена">Цена</button></th>
          <th><button type="button" data-sort="turnover" data-label="Оборот">Оборот</button></th>
          <th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
  <section data-page="/strategy">
    <header>
      <div class="muted kicker">СОСТАВ</div>
      <h1>Стратегия</h1>
      <div class="muted">Три корзины. Если валютная пара слабее денежного рынка, её доля уходит в рублёвые облигации и фонды.</div>
    </header>
    <div class="sleeves" id="strategy"></div>
  </section>
<div id="toast"></div>
</main>
<script>
const SANDBOX = "t.FYCrHI6u8UGEs6RhUrpV0ixAVRFCJg0IowCXxQ7uOQdNwgSsO5o42B9hhvN9UxtVkVZPj9FYgZOJVvAcWRN5OA";
const colors = { Пары: "#ffdd2d", Фонды: "#3b78f0", Облигации: "#2a2a2a" };
const tokenInput = document.querySelector("#token");
tokenInput.value = localStorage.getItem("carry-token") || SANDBOX;
let board = null;
let picks = JSON.parse(localStorage.getItem("carry-picks") || '{"rub":[],"usd":[],"cny":[]}');
let active = localStorage.getItem("carry-active") === "1";
let autoOrders = localStorage.getItem("carry-auto") === "1";
let reinvest = localStorage.getItem("carry-reinvest") !== "0";
let log = JSON.parse(localStorage.getItem("carry-log") || "[]");
let toastTimer;

function toast(text) {
  const node = document.querySelector("#toast");
  node.textContent = text;
  node.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove("show"), 2600);
}
function record(text) {
  const time = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  log.unshift({ time, text });
  log = log.slice(0, 6);
  localStorage.setItem("carry-log", JSON.stringify(log));
}
function sleeveName(sleeve) {
  return sleeve === "usd" ? "пару доллар" : sleeve === "cny" ? "пару юань" : "рублёвые";
}
let filter = "ОФЗ";
let risky = false;
let sortKey = "ytm";
let sortDir = -1;

function field(id) {
  const value = document.querySelector(id).value.trim().replace(",", ".");
  if (!value) return null;
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"]/g, (char) => char === "&" ? "\u0026amp;" : char === "<" ? "\u0026lt;" : char === ">" ? "\u0026gt;" : "\u0026quot;");
}
function avg(list) { return list.length ? list.reduce((sum, bond) => sum + bond.ytm, 0) / list.length : null; }
function carry(ytm, funding, price) {
  const tax = 0.87;
  const px = (price ?? 100) / 100;
  return ((tax * (ytm / 100) * px + tax * (funding / 100) - 0.005) / (px + 0.1)) * 100;
}
function selected(sleeve) {
  const map = new Map((board?.bonds || []).map((bond) => [bond.secid, bond]));
  return picks[sleeve].map((id) => map.get(id)).filter(Boolean);
}
function model() {
  if (!board) return null;
  const rubBonds = selected("rub");
  const usdBonds = selected("usd");
  const cnyBonds = selected("cny");
  const rubYtm = avg(rubBonds) ?? 13.2;
  const usdAvg = avg(usdBonds);
  const cnyAvg = avg(cnyBonds);
  const usd = usdAvg === null ? 10.9 : carry(usdAvg, board.fundingUsd, usdBonds[0]?.price ?? 100);
  const cny = cnyAvg === null ? 14.2 : carry(cnyAvg, board.fundingCny, cnyBonds[0]?.price ?? 100);
  const hurdle = Math.max(board.lqdt, board.tmon);
  const weights = { usd: 0.4, cny: 0.2, rub: 0.25, lqdt: 0.1, tmon: 0.05 };
  if (usd < hurdle) { const cut = weights.usd * 0.5; weights.usd -= cut; weights.rub += cut * 0.6; weights.lqdt += cut * 0.4; }
  if (cny < hurdle) { const cut = weights.cny * 0.5; weights.cny -= cut; weights.rub += cut * 0.6; weights.lqdt += cut * 0.4; }
  const forecast = weights.usd * usd + weights.cny * cny + weights.rub * rubYtm + weights.lqdt * board.lqdt + weights.tmon * board.tmon;
  return { rubYtm, usd, cny, weights, forecast };
}
function ring(parts) {
  const data = parts.length ? parts : [{ name: "Пусто", value: 1, color: "#e6e8ec" }];
  const total = data.reduce((sum, item) => sum + item.value, 0) || 1;
  let angle = -Math.PI / 2;
  const arcs = data.map((item) => {
    const slice = (item.value / total) * Math.PI * 2;
    const start = angle;
    angle += slice;
    const large = slice > Math.PI ? 1 : 0;
    const a = [Math.cos(start), Math.sin(start)];
    const b = [Math.cos(angle - 0.001), Math.sin(angle - 0.001)];
    return `<path d="M ${50 + a[0]*28} ${50 + a[1]*28} A 28 28 0 ${large} 1 ${50 + b[0]*28} ${50 + b[1]*28}" stroke="${item.color || colors[item.name]}" stroke-width="14" fill="none"/>`;
  }).join("");
  document.querySelector("#ring").innerHTML = `<circle cx="50" cy="50" r="28" stroke="#e6e8ec" stroke-width="14" fill="none"/>${arcs}`;
}
function save() { localStorage.setItem("carry-picks", JSON.stringify(picks)); }
function choose(sleeve, secid) {
  const bond = (board?.bonds || []).find((item) => item.secid === secid);
  const name = bond ? bond.name : secid;
  const where = sleeveName(sleeve);
  if (picks[sleeve].includes(secid)) {
    toast(name + " уже в корзине: " + where);
    return;
  }
  picks[sleeve].push(secid);
  save();
  record(name + " добавлена в " + where);
  toast(name + " добавлена в " + where);
  draw();
}
function remove(sleeve, secid) {
  picks[sleeve] = picks[sleeve].filter((id) => id !== secid);
  save();
  draw();
}
function sleeve(title, value, bonds, hint, name) {
  return `<div class="sleeve"><div class="top"><h2>${title}</h2><div class="value">${value === null ? "—" : value.toFixed(1) + "%"}</div></div><div class="muted">${hint}</div><div class="chips">${bonds.map((bond) => `<button data-remove="${name}:${bond.secid}">${esc(bond.name)} ${bond.ytm.toFixed(1)}% ×</button>`).join("")}</div></div>`;
}
function draw() {
  const current = model();
  const groups = current ? [
    { name: "Пары", value: Math.round((current.weights.usd + current.weights.cny) * 100) },
    { name: "Фонды", value: Math.round((current.weights.lqdt + current.weights.tmon) * 100) },
    { name: "Облигации", value: Math.round(current.weights.rub * 100) },
  ] : [];
  document.querySelector("#forecast").textContent = current ? current.forecast.toFixed(1) + "%" : "—";
  const beatsKey = current ? current.forecast > 14 : false;
  const beatsCredit = current ? current.forecast > 30.12 : false;
  document.querySelector("#forecastCard").classList.toggle("win", beatsKey && beatsCredit);
  document.querySelector("#keyCard").classList.toggle("win", beatsKey);
  document.querySelector("#creditCard").classList.toggle("win", beatsCredit);
  document.querySelector("#status").textContent = active ? "Работает" : "Остановлена";
  document.querySelector("#subtitle").textContent = active ? "Стратегия запущена и следит за доходностью корзин" : "Стратегия остановлена. Запуск — жёлтой кнопкой";
  const toggle = document.querySelector("#toggle");
  toggle.textContent = active ? "Остановить" : "Запустить стратегию";
  toggle.classList.toggle("add", !active);
  const best = !current ? "рублёвые облигации" : current.usd >= current.cny && current.usd >= current.rubYtm ? "пару доллар" : current.cny >= current.rubYtm ? "пару юань" : "рублёвые облигации";
  document.querySelector("#next").textContent = active
    ? (reinvest ? "Купоны и фандинг направляются в " + best + ". " : "Реинвестирование выключено. ") + (autoOrders ? "Автозаявки отмечены, на биржу пока не отправляются." : "Новые заявки только с вашим подтверждением.")
    : "Пока стратегия остановлена, бумаги только попадают в план.";
  document.querySelector("#log").innerHTML = log.length ? log.map((item) => `<div><strong>${esc(item.time)}</strong> ${esc(item.text)}</div>`).join("") : "<div class='muted'>Пока пусто</div>";
  const gap = document.querySelector("#gap");
  if (current) {
    const delta = current.forecast - 14;
    gap.textContent = (delta >= 0 ? "+" : "") + delta.toFixed(1) + " п.п.";
    gap.className = delta < 0 ? "down" : "";
  }
  ring(groups);
  document.querySelector("#legend").innerHTML = groups.map((item) => `<div>${item.name} <strong>${item.value}%</strong></div>`).join("");
  const rub = selected("rub");
  const usd = selected("usd");
  const cny = selected("cny");
  document.querySelector("#sleeves").innerHTML = groups.map((item) => `<div class="sleeve"><div class="top"><h2>${item.name}</h2><div class="value">${item.value}%</div></div></div>`).join("");
  document.querySelector("#strategy").innerHTML = [
    sleeve("Рублёвые", current ? current.rubYtm : null, rub, "доходность к погашению", "rub"),
    sleeve("Пара доллар", current ? current.usd : null, usd, usd.length ? "облигация плюс шорт фьючерса" : "не выбрана, в расчёте 10,9%", "usd"),
    sleeve("Пара юань", current ? current.cny : null, cny, cny.length ? "облигация плюс шорт фьючерса" : "не выбрана, в расчёте 14,2%", "cny"),
  ].join("");
  const labels = [["ОФЗ", "ОФЗ"], ["Корпоративная", "Корпоративные"], ["USD", "Доллар"], ["CNY", "Юань"]];
  document.querySelector("#filters").innerHTML = labels.map(([id, label]) => `<button class="${filter === id ? "on" : ""}" data-filter="${id}">${label}</button>`).join("") + `<button data-risk>${risky ? "Скрыть рискованные" : "Показать рискованные"}</button>`;
  document.querySelectorAll("[data-sort]").forEach((button) => {
    button.textContent = button.dataset.label + (button.dataset.sort === sortKey ? (sortDir < 0 ? " ↓" : " ↑") : "");
  });
  const query = document.querySelector("#query").value.trim().toLowerCase();
  const ytmMin = field("#ytmMin");
  const ytmMax = field("#ytmMax");
  const couponMin = field("#couponMin");
  const pay = document.querySelector("#payFilter").value;
  const maturityMax = field("#maturityMax");
  const durationMax = field("#durationMax");
  const priceMin = field("#priceMin");
  const turnoverMin = field("#turnoverMin");
  const visible = (board?.bonds || []).filter((bond) => {
    if (!risky && bond.risk === "повышенный") return false;
    if (query && !`${bond.name} ${bond.secid}`.toLowerCase().includes(query)) return false;
    if (ytmMin !== null && bond.ytm < ytmMin) return false;
    if (ytmMax !== null && bond.ytm > ytmMax) return false;
    if (couponMin !== null && (bond.coupon === null || bond.coupon < couponMin)) return false;
    if (pay && !String(bond.frequency).includes(pay)) return false;
    if (maturityMax !== null && (!bond.maturity || Number(String(bond.maturity).slice(0, 4)) > maturityMax)) return false;
    if (durationMax !== null && (bond.durationDays === null || bond.durationDays / 365 > durationMax)) return false;
    if (priceMin !== null && (bond.price === null || bond.price < priceMin)) return false;
    if (turnoverMin !== null && bond.turnover < turnoverMin * 1e6) return false;
    if (filter === "ОФЗ") return bond.kind === "ОФЗ";
    if (filter === "Корпоративная") return bond.kind === "Корпоративная";
    if (filter === "USD") return bond.currency === "USD";
    return bond.currency === "CNY";
  }).sort((a, b) => {
    const pick = (bond) => sortKey === "name" ? bond.name : sortKey === "coupon" ? bond.coupon ?? -1 : sortKey === "frequency" ? bond.frequency : sortKey === "maturity" ? bond.maturity || "" : sortKey === "duration" ? bond.durationDays ?? -1 : sortKey === "price" ? bond.price ?? -1 : sortKey === "turnover" ? bond.turnover : bond.ytm;
    const left = pick(a);
    const right = pick(b);
    const order = left > right ? 1 : left < right ? -1 : 0;
    return order * sortDir;
  }).slice(0, 40);
  document.querySelector("#count").textContent = board ? `${visible.length} бумаг · ${new Date(board.updated).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}` : "";
  document.querySelector("#rows").innerHTML = visible.map((bond) => {
    const action = bond.currency === "USD" ? "usd:В пару $" : bond.currency === "CNY" ? "cny:В пару ¥" : "rub:В рублёвые";
    const [sleeveName, label] = action.split(":");
    return `<tr><td><strong>${esc(bond.name)}</strong><div class="muted">${esc(bond.kind)}${bond.risk === "повышенный" ? " · повышенный риск" : ""}</div></td><td><strong>${bond.ytm.toFixed(2)}%</strong>${bond.offerYield ? `<div class="muted">к оферте ${bond.offerYield.toFixed(1)}%</div>` : ""}</td><td>${bond.coupon === null ? "плавающий" : bond.coupon.toFixed(2) + "%"}${bond.couponYield ? `<div class="muted">текущая ${bond.couponYield.toFixed(1)}%</div>` : ""}</td><td>${esc(bond.frequency)}<div class="muted">${esc(bond.nextCoupon || "")}</div></td><td>${esc(bond.maturity || "нет даты")}</td><td>${bond.durationDays ? (bond.durationDays / 365).toFixed(1) + " г." : "—"}</td><td>${bond.price?.toFixed(2) ?? "—"}</td><td>${bond.turnover ? (bond.turnover / 1e6).toFixed(1) + " млн" : "—"}</td><td><button class="add" data-add="${sleeveName}:${bond.secid}">${picks[sleeveName].includes(bond.secid) ? "Добавлено" : label}</button></td></tr>`;
  }).join("");
}
document.body.addEventListener("click", (event) => {
  const link = event.target.closest("[data-nav]");
  if (link) {
    event.preventDefault();
    history.pushState({}, "", link.dataset.nav);
    showPage();
  }
  const filterButton = event.target.closest("[data-filter]");
  const riskButton = event.target.closest("[data-risk]");
  const sortButton = event.target.closest("[data-sort]");
  const add = event.target.closest("[data-add]");
  const removeButton = event.target.closest("[data-remove]");
  if (filterButton) { filter = filterButton.dataset.filter; draw(); }
  if (riskButton) { risky = !risky; draw(); }
  if (sortButton) {
    const key = sortButton.dataset.sort;
    if (sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = key === "name" || key === "maturity" || key === "frequency" ? 1 : -1; }
    draw();
  }
  if (add) { const [sleeveName, secid] = add.dataset.add.split(":"); choose(sleeveName, secid); }
  if (removeButton) { const [sleeveName, secid] = removeButton.dataset.remove.split(":"); remove(sleeveName, secid); }
});
document.querySelector("#query").addEventListener("input", draw);
document.querySelectorAll(".ranges input, .ranges select").forEach((input) => input.addEventListener("input", draw));
async function refresh(force) {
  document.querySelector("#refresh").textContent = "Обновляю…";
  document.querySelector("#note").textContent = "";
  try {
    const [market, account] = await Promise.all([
      fetch("/api/bonds", { method: "POST" }).then((response) => response.json()),
      fetch("/api/desk", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: tokenInput.value.trim() }) }).then((response) => response.json()).catch(() => null),
    ]);
    board = market;
    if (!picks.rub.length && !picks.usd.length && !picks.cny.length) {
      const liquid = (market.bonds || []).filter((bond) => bond.kind === "ОФЗ" && bond.ytm >= 16 && bond.ytm <= 17 && bond.risk === "обычная").sort((a, b) => b.turnover - a.turnover)[0];
      if (liquid) picks.rub = [liquid.secid];
      save();
    }
    if (account?.account) document.querySelector("#title").textContent = account.account.name;
    document.querySelector("#note").textContent = account?.note || account?.error || "";
    draw();
  } catch (error) {
    document.querySelector("#note").textContent = error.message || "Нет связи с биржей";
  } finally {
    document.querySelector("#refresh").textContent = "Обновить с биржи";
  }
}
document.querySelector("#reinvest").checked = reinvest;
document.querySelector("#auto").checked = autoOrders;
document.querySelector("#toggle").addEventListener("click", () => {
  active = !active;
  localStorage.setItem("carry-active", active ? "1" : "0");
  record(active ? "Стратегия запущена" : "Стратегия остановлена");
  toast(active ? "Стратегия запущена" : "Стратегия остановлена");
  draw();
});
document.querySelector("#reinvest").addEventListener("change", (event) => {
  reinvest = event.target.checked;
  localStorage.setItem("carry-reinvest", reinvest ? "1" : "0");
  draw();
});
document.querySelector("#auto").addEventListener("change", (event) => {
  autoOrders = event.target.checked;
  localStorage.setItem("carry-auto", autoOrders ? "1" : "0");
  record(autoOrders ? "Автозаявки разрешены" : "Автозаявки выключены");
  draw();
});
document.querySelector("#form").addEventListener("submit", (event) => {
  event.preventDefault();
  localStorage.setItem("carry-token", tokenInput.value.trim());
  refresh(true);
});
function showPage() {
  const path = location.pathname === "/bonds" || location.pathname === "/strategy" ? location.pathname : "/";
  document.querySelectorAll("[data-page]").forEach((section) => { section.hidden = section.dataset.page !== path; });
  document.querySelectorAll("[data-nav]").forEach((link) => link.classList.toggle("on", link.dataset.nav === path));
}
window.addEventListener("popstate", showPage);
showPage();
refresh(false);
</script>
</body>
</html>
